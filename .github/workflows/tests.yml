# Regression suite. Runs on every push, and nightly against production so
# outside changes (an expired API key, congress.gov changing shape) are
# caught even when nobody pushed anything. GitHub emails the repo owner
# when a run fails.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * *'   # 7am Eastern
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/helpers/gh-reporter.mjs --test-reporter-destination=stdout 'tests/unit/*.test.js'

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/phone-check.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: phone-check-out/
          retention-days: 14

  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/helpers/gh-reporter.mjs --test-reporter-destination=stdout 'tests/live/*.test.js'
