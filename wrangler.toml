name = "mycivix"
pages_build_output_dir = "."
compatibility_date = "2026-08-24"

# Explicit env.preview / env.production blocks only -- no root-level
# fallback. A root-level [[kv_namespaces]] plus a separate
# env.production.kv_namespaces override was tried first and did NOT work:
# Production kept resolving to the root-level (preview) namespace even
# after a fresh deploy. Scoping both environments explicitly, with nothing
# left ambiguous at the root, is the fix being tested here.
#
# ANTHROPIC_API_KEY is a secret and stays out of this file entirely -- it's
# set as an encrypted var directly in the dashboard for both environments.
[env.preview.vars]
DIG_DAILY_BUDGET_USD = "2"

[[env.preview.kv_namespaces]]
binding = "DIG_KV"
id = "c1e1b859de3a4685b112c23f340be38c"

[[env.production.kv_namespaces]]
binding = "DIG_KV"
id = "51a8027e54724bfb8b6cb34d3ae10ec3"
