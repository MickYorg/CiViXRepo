name = "mycivix"
pages_build_output_dir = "."
compatibility_date = "2026-08-24"

# Cloudflare Pages applies this root-level (non `env.production`) config to
# the PREVIEW environment specifically for a git-connected project — confirmed
# by the dashboard locking Preview's non-secret vars to this file the moment
# it existed, while Production stayed dashboard-managed. Production has no
# override block here on purpose, since it's already set by hand in the
# dashboard (Settings -> Environment variables / Functions, Production tab).
# ANTHROPIC_API_KEY is a secret and stays out of this file — it's set as an
# encrypted var directly in the dashboard for both environments instead.
[vars]
DIG_DAILY_BUDGET_USD = "2"

[[kv_namespaces]]
binding = "DIG_KV"
id = "c1e1b859de3a4685b112c23f340be38c"
